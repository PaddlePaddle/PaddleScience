defaults:
  - ppsci_default
  - TRAIN: train_default
  - TRAIN/ema: ema_default
  - TRAIN/swa: swa_default
  - EVAL: eval_default
  - INFER: infer_default
  - hydra/job/config/override_dirname/exclude_keys: exclude_keys_default
  - _self_

hydra:
  run:
    dir: ./outputs_un_confild_case3
  job:
    name: ${mode}
    chdir: false
  callbacks:
    init_callback:
      _target_: ppsci.utils.callbacks.InitCallback
  sweep:
    dir: ${hydra.run.dir}
    subdir: ./

mode: eval
seed: 2025
output_dir: ${hydra:run.dir}
log_freq: 20
save_path: ${output_dir}/result.npy

TRAIN:
  batch_size : 16
  test_batch_size : 16
  ema_rate: "0.9999"
  lr_anneal_steps: 10000
  lr : 5.e-5
  weight_decay: 0.0
  final_lr: 1.e-5
  microbatch: -1
  max_steps: 10000

EVAL:
  mutil_GPU: 2
  lr : 5.e-5
  ema_rate: "0.9999"
  log_interval: 1000
  save_interval: 10000
  lr_anneal_steps: 0
  time_length : 256
  latent_length : 256
  test_batch_size: 16

UNET:
  image_size : 256
  num_channels: 128
  num_res_blocks: 2
  num_heads: 4
  num_head_channels: 64
  attention_resolutions: "32,16,8"
  channel_mult: null
  ema_path: /home/aistudio/work/data/Case3/diffusion/ema.pdparams

Diff:
  steps: 1000
  noise_schedule: "cosine"

CNF:
  mutil_GPU: 1
  data_path: /home/aistudio/work/data/Case3/data.npy
  coor_path: /home/aistudio/work/data/Case3/coords.npy
  normalizer:
    method: "-11"
    dim: 0
  load_data_fn: load_periodic_hill_flow
  CONFILD:
    input_keys: ["confild_x", "latent_z"]
    output_keys: ["confild_output"]
    num_hidden_layers: 117
    out_features: 2
    hidden_features: 256
    in_coord_features: 2
    in_latent_features: 256
  normalizer_params_path: /home/aistudio/work/data/Case3/cnf/normalizer_params.pdparams
  model_path: /home/aistudio/work/PaddleScience/examples/confild/cnf_model.pdparams

DATA:
  min_val: -1.0
  max_val: 1.0
  train_data: "/home/aistudio/work/data/Case3/train_data.npy"
  valid_data: "/home/aistudio/work/data/Case3/valid_data.npy"

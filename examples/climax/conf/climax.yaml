defaults:
  - ppsci_default
  - TRAIN: train_default
  - EVAL: eval_default
  - hydra/job/config/override_dirname/exclude_keys: exclude_keys_default
  - _self_

hydra:
  run:
    # output directory (override on the command line for separate runs)
    dir: ./exps/climate_projection
  job:
    name: ${mode} # name of logfile
    chdir: false # keep current working directory unchanged
  callbacks:
    init_callback:
      _target_: ppsci.utils.callbacks.InitCallback
  sweep:
    # output directory for multirun
    dir: ${hydra.run.dir}
    subdir: ./

# general settings
mode: train # running mode: train/eval
seed: 42
output_dir: ${hydra:run.dir}
log_freq: 20
to_static: false # toggled together with CLIMAX_USE_CINN in main.py

# dataset settings
DATA:
  # ClimateBench 5.625deg dataset root (contains train_val/ and test/)
  root_dir: ./data/climatebench/5.625deg
  history: 10
  list_train_simu: ["ssp126", "ssp370", "ssp585", "historical", "hist-GHG", "hist-aer"]
  list_test_simu: ["ssp245"]
  variables: ["CO2", "SO2", "CH4", "BC"]
  out_variables: "tas"
  train_ratio: 0.9
  num_workers: 1

# model settings
MODEL:
  input_keys: ["x", "lead_times"]
  output_keys: ["tas"]
  default_vars: ["CO2", "SO2", "CH4", "BC"]
  out_vars: "tas" # diurnal_temperature_range, tas, pr, pr90
  img_size: [32, 64]
  time_history: 10
  patch_size: 2
  embed_dim: 1024
  depth: 8
  num_heads: 16
  mlp_ratio: 4
  drop_path: 0.1
  drop_rate: 0.1
  parallel_patch_embed: false
  freeze_encoder: true

# training settings
TRAIN:
  epochs: 50
  save_freq: 5
  eval_during_train: true
  eval_freq: 1 # unit: epoch
  # iters_per_epoch is set in main.py from the dataloader length
  batch_size: 1
  # AdamW settings (parameter groups are assembled in main.py)
  beta_1: 0.9
  beta_2: 0.999
  weight_decay: 1e-5
  # full initial state (backbone + heads, strict load); pretrained_path is
  # ignored when this is set
  init_state_path: ""
  # pre-trained MAE checkpoint (pdparams) for partial weight loading
  pretrained_path: ""
  lr_scheduler:
    # step-unit schedule: warmup_epochs/max_epochs count optimizer steps
    learning_rate: 5e-4
    warmup_epochs: 60
    max_epochs: 600
    warmup_start_lr: 1e-8
    eta_min: 1e-8
  pretrained_model_path: null
  checkpoint_path: null

# evaluation settings
EVAL:
  pretrained_model_path: null
  compute_metric_by_batch: true
  eval_with_no_grad: true
  batch_size: 1

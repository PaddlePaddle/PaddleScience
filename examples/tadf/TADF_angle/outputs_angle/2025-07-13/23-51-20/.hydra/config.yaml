mode: eval
output_dir: ${hydra:run.dir}
log_freq: 20
seed: 42
use_vdl: false
use_tbd: false
wandb_config: {}
use_wandb: false
device: null
use_amp: false
amp_level: O1
to_static: false
prim: false
log_level: info
TRAIN:
  epochs: 200
  iters_per_epoch: 20
  update_freq: 1
  save_freq: 100
  eval_during_train: false
  start_eval_epoch: 1
  eval_freq: 1
  checkpoint_path: null
  pretrained_model_path: null
  ema:
    use_ema: false
    decay: 0.9
    avg_freq: 1
  swa:
    use_swa: false
    avg_freq: 1
    avg_range: null
  batch_size: 8
  learning_rate: 0.01
  weight_decay: 1.0e-05
  k: 9
  i: 2
EVAL:
  pretrained_model_path: https://paddle-org.bj.bcebos.com/paddlescience/models/TADF/angle/angle_model.pdparams
  eval_with_no_grad: false
  compute_metric_by_batch: false
  batch_size: 8
  test_size: 0.1
  seed: 20
INFER:
  pretrained_model_path: null
  export_path: ./inference
  pdmodel_path: null
  pdiparams_path: null
  onnx_path: null
  device: cpu
  engine: native
  precision: fp32
  ir_optim: true
  min_subgraph_size: 30
  gpu_mem: 2000
  gpu_id: 0
  max_batch_size: 1024
  num_cpu_threads: 10
  batch_size: 256
data_dir: ./angle.dat
sim_dir: ./smis.txt
MODEL:
  output_keys:
  - u
  activation: relu
  dropout: 0.5

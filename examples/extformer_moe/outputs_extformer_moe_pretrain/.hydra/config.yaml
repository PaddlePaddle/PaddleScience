mode: eval
output_dir: ${hydra:run.dir}
log_freq: 20
seed: 0
use_vdl: false
use_tbd: false
wandb_config: {}
use_wandb: false
device: null
use_amp: false
amp_level: O1
to_static: false
prim: false
log_level: info
trace: false
TRAIN:
  epochs: 100
  iters_per_epoch: 20
  update_freq: 1
  save_freq: 20
  eval_during_train: true
  start_eval_epoch: 1
  eval_freq: 10
  checkpoint_path: null
  pretrained_model_path: null
  ema:
    use_ema: false
    decay: 0.9
    avg_freq: 1
  swa:
    use_swa: false
    avg_freq: 1
    avg_range: null
  lr_scheduler:
    epochs: ${TRAIN.epochs}
    learning_rate: 0.0002
    by_epoch: true
  min_lr_ratio: 0.001
  wd: 1.0e-05
  batch_size: 16
EVAL:
  pretrained_model_path: https://paddle-org.bj.bcebos.com/paddlescience/models/extformer-moe/extformer_moe_pretrained.pdparams
  eval_with_no_grad: true
  compute_metric_by_batch: false
  batch_size: 1
INFER:
  pretrained_model_path: null
  export_path: ./inference
  pdmodel_path: null
  pdiparams_path: null
  onnx_path: null
  device: cpu
  engine: native
  precision: fp32
  ir_optim: true
  min_subgraph_size: 30
  gpu_mem: 2000
  gpu_id: 0
  max_batch_size: 1024
  num_cpu_threads: 10
  batch_size: 256
FILE_PATH: /root/workspace/PaddleScience/examples/extformer_moe/data/weather_data/icar_enso_2021/enso_round1_train_20210201
DATASET:
  label_keys:
  - sst_target
  - nino_target
  in_len: 12
  out_len: 14
  nino_window_t: 3
  in_stride: 1
  out_stride: 1
  train_samples_gap: 1
  eval_samples_gap: 1
  normalize_sst: true
MODEL:
  input_keys:
  - sst_data
  output_keys:
  - sst_target
  - nino_target
  - aux_loss
  - rank_loss
  input_shape:
  - 12
  - 24
  - 48
  - 1
  target_shape:
  - 14
  - 24
  - 48
  - 1
  base_units: 64
  scale_alpha: 1.0
  enc_depth:
  - 1
  - 1
  dec_depth:
  - 1
  - 1
  enc_use_inter_ffn: true
  dec_use_inter_ffn: true
  dec_hierarchical_pos_embed: false
  downsample: 2
  downsample_type: patch_merge
  upsample_type: upsample
  num_global_vectors: 0
  use_dec_self_global: false
  dec_self_update_global: true
  use_dec_cross_global: false
  use_global_vector_ffn: false
  use_global_self_attn: false
  separate_global_qkv: false
  global_dim_ratio: 1
  self_pattern: axial
  cross_self_pattern: axial
  cross_pattern: cross_1x1
  dec_cross_last_n_frames: null
  attn_drop: 0.1
  proj_drop: 0.1
  ffn_drop: 0.1
  num_heads: 4
  ffn_activation: gelu
  gated_ffn: false
  norm_layer: layer_norm
  padding_type: zeros
  pos_embed_type: t+h+w
  use_relative_pos: true
  self_attn_use_final_proj: true
  dec_use_first_self_attn: false
  z_init_method: zeros
  initial_downsample_type: conv
  initial_downsample_activation: leaky_relu
  initial_downsample_scale:
  - 1
  - 1
  - 2
  initial_downsample_conv_layers: 2
  final_upsample_conv_layers: 1
  checkpoint_level: 0
  attn_linear_init_mode: '0'
  ffn_linear_init_mode: '0'
  conv_init_mode: '0'
  down_up_linear_init_mode: '0'
  norm_init_mode: '0'
MOE:
  use_linear_moe: false
  use_ffn_moe: true
  use_attn_moe: false
  num_experts: 10
  out_planes: 4
  importance_weight: 0.0
  load_weight: 0.0
  gate_style: cuboid-latent
  dispatch_style: dense
  aux_loss_style: all
RNC:
  use_rnc: true
  rank_imbalance_style: batch+T+H+W
  feature_similarity_style: l2
  rank_imbalance_temp: 2
  label_difference_style: l1
  rank_reg_coeff: 0.01
  loss_cal_style: computation-efficient

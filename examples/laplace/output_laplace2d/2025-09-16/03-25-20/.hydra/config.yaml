mode: train
output_dir: ${hydra:run.dir}
log_freq: 20
seed: 2024
use_vdl: false
use_tbd: false
wandb_config: {}
use_wandb: false
device: null
use_amp: false
amp_level: O1
to_static: false
prim: false
log_level: info
trace: false
TRAIN:
  epochs: 20000
  iters_per_epoch: 1
  update_freq: 1
  save_freq: 0
  eval_during_train: true
  start_eval_epoch: 1
  eval_freq: 200
  checkpoint_path: null
  pretrained_model_path: null
  ema:
    use_ema: false
    decay: 0.9
    avg_freq: 1
  swa:
    use_swa: false
    avg_freq: 1
    avg_range: null
  learning_rate: 0.001
EVAL:
  pretrained_model_path: null
  eval_with_no_grad: true
  compute_metric_by_batch: false
  batch_size: 256
INFER:
  pretrained_model_path: https://paddle-org.bj.bcebos.com/paddlescience/models/laplace2d/laplace2d_pretrained.pdparams
  export_path: ./inference/laplace2d
  pdmodel_path: ${INFER.export_path}.pdmodel
  pdiparams_path: ${INFER.export_path}.pdiparams
  onnx_path: ${INFER.export_path}.onnx
  device: sdaa
  engine: native
  precision: fp32
  ir_optim: true
  min_subgraph_size: 10
  gpu_mem: 4000
  gpu_id: 0
  max_batch_size: 64
  num_cpu_threads: 4
  batch_size: 64
NPOINT_INTERIOR: 9801
NPOINT_BC: 400
DIAGONAL_COORD:
  xmin:
  - 0.0
  - 0.0
  xmax:
  - 1.0
  - 1.0
MODEL:
  input_keys:
  - x
  - 'y'
  output_keys:
  - u
  num_layers: 5
  hidden_size: 20
